# 琉璃观测台 · 1Panel「容器 → 编排」使用
# 部署前只需要改标了【改】的两处，详见《部署说明.md》
services:
  liuli-obs:
    # 镜像在服务器上从源码构建。不要加 image: 字段——1Panel 创建编排时会拿 image 的名字去仓库拉取，
    # 本地构建的镜像仓库里没有，会报「拉取镜像失败」
    build: .
    # 自建镜像必须写这一行，否则 compose 会去镜像仓库拉取而失败
    pull_policy: build
    container_name: liuli-obs
    restart: unless-stopped
    # 只绑本机，由 OpenResty 反代并配 HTTPS
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      TZ: Asia/Shanghai
      # 【改】首次启动时的管理员密码（至少 10 位）。启动后在网页「设置」里改密码即可，这里不用再动
      LIULI_ADMIN_PASSWORD: "请改成你自己的密码"
      # 忘记密码时：把上面改成新密码、这里改成 "1"，重建容器后登录，再改回 "0"
      LIULI_RESET_PASSWORD: "0"
      # 【改】首次启动时导入的站点：域名=容器内日志路径，多个用分号隔开。以后在网页「设置」里增删
      LIULI_SITES: "sosoquark.com=/logs/sosoquark.com/log/access.log"
      # 观测台自己的会话 Cookie 只走 HTTPS；如果暂时用 http 访问调试，改成 "0"
      LIULI_COOKIE_SECURE: "1"
      GOMEMLIMIT: 80MiB
    volumes:
      # 1Panel 网站目录（里面是 <域名>/log/access.log），只读挂载。站长的服务器已确认是这个路径
      - /opt/1panel/www/sites:/logs:ro
      # 数据库（统计数据、设置、账号）
      - liuli-data:/data
    networks:
      - 1panel-network
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  1panel-network:
    external: true

volumes:
  liuli-data:
