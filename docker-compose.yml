# 琉璃观测台 · docker compose / 1Panel「容器 → 编排」
#
# 个性化配置（管理员密码、日志目录、1Panel API 密钥等）都写在同目录的 .env 里，不用改这个文件：
#   cp .env.example .env && chmod 600 .env   然后按注释修改
# 这样以后 git pull 升级不会和你的配置冲突，密码和密钥也不会被提交到仓库。
services:
  liuli-obs:
    # 镜像从源码构建。不要加 image 字段——1Panel 创建编排时会拿镜像名去仓库拉取，
    # 本地构建的镜像仓库里没有，会报「拉取镜像失败」
    build: .
    # 自建镜像必须写这一行，否则 compose 会去镜像仓库拉取而失败
    pull_policy: build
    container_name: liuli-obs
    restart: unless-stopped
    # 只绑本机，由 OpenResty / Nginx 反代并配 HTTPS
    ports:
      - "127.0.0.1:${LIULI_PORT:-8090}:8090"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LIULI_ADMIN_PASSWORD: ${LIULI_ADMIN_PASSWORD:-}
      LIULI_RESET_PASSWORD: ${LIULI_RESET_PASSWORD:-0}
      LIULI_SITES: ${LIULI_SITES:-}
      LIULI_COOKIE_SECURE: ${LIULI_COOKIE_SECURE:-1}
      # 封禁 IP：规则写到容器内 /ban（即宿主机 LIULI_BAN_HOST_DIR），OpenResty 从 LIULI_BAN_INCLUDE 读取
      LIULI_BAN_DIR: /ban
      LIULI_BAN_INCLUDE: ${LIULI_BAN_INCLUDE:-/www/liuli-ban/deny.conf}
      LIULI_1PANEL_URL: ${LIULI_1PANEL_URL:-}
      LIULI_1PANEL_API_KEY: ${LIULI_1PANEL_API_KEY:-}
      LIULI_1PANEL_KEY_ID: ${LIULI_1PANEL_KEY_ID:-}
      GOMEMLIMIT: 80MiB
    volumes:
      # 网站日志目录（里面是 <域名>/log/access.log），只读挂载
      - ${LIULI_LOGS_DIR:-/opt/1panel/www/sites}:/logs:ro
      # 封禁规则目录：观测台唯一可写的宿主机目录，只放 deny.conf
      - ${LIULI_BAN_HOST_DIR:-/opt/1panel/www/liuli-ban}:/ban
      # 数据库（统计数据、设置、账号）
      - liuli-data:/data
    networks:
      1panel-network:
        # 固定 IP，方便在 1Panel API 密钥的 IP 白名单里只放行观测台。留空则自动分配
        ipv4_address: ${LIULI_IPV4:-}
    # ---- 加固：根文件系统只读、去掉所有特权、禁止提权、限制进程数 ----
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  # 1Panel 自带的外部网络。不用 1Panel 时可以先 docker network create 1panel-network，或删掉这两段
  1panel-network:
    external: true

volumes:
  liuli-data:
